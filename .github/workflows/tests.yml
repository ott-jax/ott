name: Tests

on:
  schedule:
  - cron: 00 00 * * 1
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Python ${{ matrix.python-version }} ${{ matrix.jax-version }} (fast)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        jax-version: [jax-default, jax-latest]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test,neural]"

    - name: Install JAX from main
      if: ${{ matrix.jax-version == 'jax-latest' }}
      run: python -m pip install 'git+https://github.com/jax-ml/jax@main'

    - name: Run tests
      continue-on-error: ${{ matrix.jax-version == 'jax-latest' }}
      run: python -m pytest -m fast -n auto --strict-rng --memray -vv

  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
        - python-version: '3.12'
          os: macos-15

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test,neural]"

    - name: Run tests
      run: |
        python -m pytest -n auto --strict-rng --memray -vv \
          --cov=ott --no-cov-on-fail --cov-report=xml \
          --cov-report=term-missing:skip-covered

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: tests-${{ matrix.os }}-${{ matrix.python-version }}
        name: unittests
        token: ${{ secrets.CODECOV_TOKEN }}
        env_vars: OS,PYTHON
        fail_ci_if_error: false
        verbose: true
